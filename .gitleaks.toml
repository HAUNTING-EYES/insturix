# gitleaks config for Insturix Front-End
# Scanned in CI over the working tree (see .github/workflows/gitleaks.yml).
title = "Insturix gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Deliberate dummies, placeholders, env-var references, and test fixtures"
paths = [
  # Read-only probe sets a fake service account it never authenticates with.
  '''scripts/probe-semantic-mg-rerun\.ts''',
  # Test fixtures may contain synthetic tokens/ids.
  '''.*\.test\.(ts|tsx|js|mjs|py)$''',
  # Historical session logs (secrets already removed from HEAD; history purge tracked separately).
  '''docs/agents/sessions/.*\.md$''',
]
regexes = [
  '''example\.invalid''',
  '''read-only-mg-probe''',
  '''<[A-Za-z0-9_-]+>''',            # <user>, <password> style placeholders
  '''process\.env\.[A-Z0-9_]+''',    # env-var references, not literals
  '''os\.environ''',
  '''YOUR_[A-Z0-9_]+''',
  '''placeholder''',
  '''sk_test_''',                     # Stripe/Clerk publishable test keys
]

# The default generic-api-key rule misidentifies these published protocol
# artifacts and SHA-256 integrity receipts. Every exception is constrained by
# both the semantic field name and the exact line shape.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public IndexNow ownership proof"
condition = "AND"
regexTarget = "line"
paths = [ '''(?:^|[\\/])scripts[\\/]indexnow-submit\.mjs$''' ]
regexes = [ '''^\s*const KEY = "[a-z0-9]{32}";\s*$''' ]

[[rules.allowlists]]
description = "Named SHA-256 integrity receipts"
regexTarget = "line"
regexes = [
  '''(?i)^\s*(?:RENDER_PROOF_DELIVERY_API_WORKERS|apiImplementationHash)\s*[:=]\s*['"][a-f0-9]{64}['"],?\s*$''',
  '''(?i)^\s*"(?:packetHash|transportHash|providerCountTokensRequestHash|planHash)"\s*:\s*"[a-f0-9]{64}",?\s*$''',
]
