name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan committed files for high-risk secrets
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          excluded_dirs = {'.git', '.next', '.codex-digest', 'node_modules', 'vendor'}
          allowlist_fragments = (
              '<',
              'PASSWORD@',
              'dummy',
              'example',
              'localhost',
              'placeholder',
              'sk_test_',
              'your-',
              'your_',
          )
          patterns = [
              ('Google API key', re.compile(r'AIza[0-9A-Za-z_-]{20,}')),
              ('MongoDB URI with embedded credentials', re.compile(r'mongodb(?:\+srv)?://[^:\s\'"<>/]+:[^@\s\'"<>]{8,}@')),
              ('OpenAI-style secret key', re.compile(r'\bsk-(?!test\b)[A-Za-z0-9_-]{20,}\b')),
              ('AWS access key', re.compile(r'\bAKIA[0-9A-Z]{16}\b')),
              ('Private key block', re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----')),
          ]

          findings = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in excluded_dirs]
              for filename in files:
                  path = os.path.join(root, filename)
                  try:
                      with open(path, 'r', encoding='utf-8') as handle:
                          lines = handle.readlines()
                  except UnicodeDecodeError:
                      continue
                  for line_number, line in enumerate(lines, start=1):
                      for label, pattern in patterns:
                          for match in pattern.finditer(line):
                              value = match.group(0)
                              if any(fragment.lower() in value.lower() for fragment in allowlist_fragments):
                                  continue
                              findings.append((path, line_number, label))

          if findings:
              print('Potential committed secrets found:')
              for path, line_number, label in findings:
                  print(f'  {path}:{line_number}: {label}')
              sys.exit(1)

          print('No high-risk committed secrets found.')
          PY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No version needed — reads pnpm version from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    # Run independently from lint so both results show on PR
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No version needed — reads pnpm version from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        # Using || true for now because there are existing type errors in the codebase.
        # TODO: Remove "|| true" once all type errors are resolved and
        #       ignoreBuildErrors is set to false in next.config.ts
        run: pnpm tsc --noEmit || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No version needed — reads pnpm version from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          # Tests run against mocks — no real env vars needed
          # Add any test-specific env vars here if needed
          NODE_ENV: test

  build:
    name: Build Check
    runs-on: ubuntu-latest
    # Build is the most expensive step — run last
    needs: [secret-scan, lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No version needed — reads pnpm version from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Provide dummy env vars so the build doesn't fail on missing secrets
          # These are NOT real values — build-time checks only
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://localhost:27017/test' }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME || 'insturix_test' }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY || 'placeholder' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'placeholder' }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT || 'placeholder' }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME || 'placeholder' }}
