name: PR Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan committed files for high-risk secrets
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          excluded_dirs = {'.git', '.next', '.codex-digest', 'node_modules', 'vendor'}
          allowlist_fragments = (
              '<',
              'PASSWORD@',
              'dummy',
              'example',
              'localhost',
              'placeholder',
              'sk_test_',
              'your-',
              'your_',
          )
          patterns = [
              ('Google API key', re.compile(r'AIza[0-9A-Za-z_-]{20,}')),
              ('MongoDB URI with embedded credentials', re.compile(r'mongodb(?:\+srv)?://[^:\s\'"<>/]+:[^@\s\'"<>]{8,}@')),
              ('OpenAI-style secret key', re.compile(r'\bsk-(?!test\b)[A-Za-z0-9_-]{20,}\b')),
              ('AWS access key', re.compile(r'\bAKIA[0-9A-Z]{16}\b')),
              ('Private key block', re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----')),
          ]

          findings = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in excluded_dirs]
              for filename in files:
                  path = os.path.join(root, filename)
                  try:
                      with open(path, 'r', encoding='utf-8') as handle:
                          lines = handle.readlines()
                  except UnicodeDecodeError:
                      continue
                  for line_number, line in enumerate(lines, start=1):
                      for label, pattern in patterns:
                          for match in pattern.finditer(line):
                              value = match.group(0)
                              if any(fragment.lower() in value.lower() for fragment in allowlist_fragments):
                                  continue
                              findings.append((path, line_number, label))

          if findings:
              print('Potential committed secrets found:')
              for path, line_number, label in findings:
                  print(f'  {path}:{line_number}: {label}')
              sys.exit(1)

          print('No high-risk committed secrets found.')
          PY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No version needed — reads pnpm version from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm exec eslint . --quiet

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    # Run independently from lint so both results show on PR
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No version needed — reads pnpm version from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No version needed — reads pnpm version from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          # Tests run against mocks — no real env vars needed
          # Add any test-specific env vars here if needed
          NODE_ENV: test

  thinkforge-browser:
    name: ThinkForge Browser Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THINKFORGE_E2E_MODE: '1'
      THINKFORGE_E2E_BASE_URL: http://127.0.0.1:3101
      THINKFORGE_E2E_DATABASE_URI: ${{ secrets.THINKFORGE_E2E_DATABASE_URI }}
      THINKFORGE_E2E_REDIS_REST_URL: ${{ secrets.THINKFORGE_E2E_REDIS_REST_URL }}
      THINKFORGE_E2E_REDIS_REST_TOKEN: ${{ secrets.THINKFORGE_E2E_REDIS_REST_TOKEN }}
      THINKFORGE_E2E_BASE_EMAIL: ${{ secrets.THINKFORGE_E2E_BASE_EMAIL }}
      THINKFORGE_E2E_WRITER_FIXTURE: auto
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.THINKFORGE_E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.THINKFORGE_E2E_CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Validate and scope the disposable tenant
        shell: bash
        run: |
          required=(
            THINKFORGE_E2E_DATABASE_URI
            THINKFORGE_E2E_REDIS_REST_URL
            THINKFORGE_E2E_REDIS_REST_TOKEN
            THINKFORGE_E2E_BASE_EMAIL
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            CLERK_SECRET_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required ThinkForge E2E secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" != pk_test_* ]]; then
            echo 'ThinkForge E2E requires a Clerk test publishable key.' >&2
            exit 1
          fi
          if [[ "$CLERK_SECRET_KEY" != sk_test_* ]]; then
            echo 'ThinkForge E2E requires a Clerk test secret key.' >&2
            exit 1
          fi
          if [[ "$THINKFORGE_E2E_BASE_EMAIL" != *@* ]]; then
            echo 'THINKFORGE_E2E_BASE_EMAIL must be a valid disposable test address.' >&2
            exit 1
          fi

          run_id="ci$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | sha256sum | cut -c1-10)"
          local_part="${THINKFORGE_E2E_BASE_EMAIL%@*}"
          local_part="${local_part%%+*}"
          domain="${THINKFORGE_E2E_BASE_EMAIL##*@}"
          {
            echo "THINKFORGE_E2E_RUN_ID=$run_id"
            echo "THINKFORGE_E2E_USER_EMAIL=${local_part}+${run_id}@${domain}"
            echo "THINKFORGE_E2E_BRAND_ID=brand_${run_id}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated ThinkForge journeys
        run: pnpm exec playwright test tests/e2e/thinkforge-browser.spec.ts --project=thinkforge-chromium

      - name: Upload ThinkForge browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thinkforge-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/playwright/report
            .artifacts/playwright/results
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build Check
    runs-on: ubuntu-latest
    # Build is the most expensive step — run last
    needs: [secret-scan, lint, typecheck, test, thinkforge-browser]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No version needed — reads pnpm version from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Provide dummy env vars so the build doesn't fail on missing secrets
          # These are NOT real values — build-time checks only
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://localhost:27017/test' }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME || 'insturix_test' }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY || 'placeholder' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'placeholder' }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT || 'placeholder' }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME || 'placeholder' }}
